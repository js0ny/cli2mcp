[package]
name = "cli2mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An MCP bridge converted from CLI for better permission control"

[dependencies]
clap = "4.6.7"
jsonschema = { version = "0.60.1", default-features = false }
rmcp = { version = "3.7.0", default-features = false, features = [
    "server",
    "transport-io",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "rt",
    "macros",
    "process",
    "time",
    "io-util",
] }
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "=3.27.0"
